<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
 margin:0;background:#08040f;color:white;
 height:100vh;display:flex;align-items:center;
 justify-content:center;overflow:hidden;
 font-family:'VT323',monospace;
 touch-action:none;
}
#game{

 height:min(100vh,760px);overflow:hidden;
 background:#1a82e2;
}
canvas{width:100%;height:100%;display:block;}
#hud{

}
#hud div{

}

/* CONTROLES INFERIORES CENTRALES */
#bottomControls {
 position: absolute;
 bottom: 15px;
 left: 50%;
 transform: translateX(-50%);
 display: flex;
 gap: 10px;
 z-index: 10;
 pointer-events: auto;
}
.ctrl-btn {
 width: 45px;
 height: 45px;
 padding: 0;

 background: rgba(23, 8, 44, 0.9);
 border: 2px solid #ff59d8;

 display: flex;
 align-items: center;
 justify-content: center;

 user-select: none;
 -webkit-user-select: none;
 box-shadow: 0 0 8px rgba(255, 89, 216, 0.3);
}
.ctrl-btn:active {
 transform: scale(0.90);
 background: #ff00ce;
 border-color: #65ffae;
}

.screen{
 position:absolute;inset:0;z-index:5;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;padding:12px;
 backdrop-filter: blur(4px);
 -webkit-backdrop-filter: blur(4px);
 background: radial-gradient(ellipse at center, rgba(50, 16, 91, 0.85), rgba(6, 3, 18, 0.92));
}

.screen h1{
 font-family:'Press Start 2P';
 font-size:clamp(16px,5vw,22px);
 line-height:1.4;color:#78ff9c;
 text-shadow:3px 3px #d000ff;
 margin:2px 0;
}
.screen p{font-size:18px;line-height:1.2;margin:4px 0;}
.input-group{
 display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;margin:2px 0;
}
.input-label{

}
.screen input.input-error{

}
.error-msg{

 color: #ff4d79;

 min-height: 10px;
}
@keyframes inputShake{
 0%, 100% { transform: translateX(0); }
 25% { transform: translateX(-6px); }
 75% { transform: translateX(6px); }
}

/* SKIN SHOP ESTILO KIOSKO */
.shop-kiosk-container {
 display: flex;
 flex-direction: row;
 align-items: center;

 background: rgba(16, 7, 32, 0.96);

.shop-left-pane h3 {

/* Intro tipo Looney Tunes */
#looneyIntro{
 position:absolute;inset:0;z-index:20;
 background:#07020e;cursor:pointer;

.death-box .stats-row{

.death-box button{

<div id="game">
<canvas id="canvas" width="450" height="760"></canvas>

<div id="hud">

 </div>

</div>

<!-- SDKs de Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// --- CONFIGURACIÓN DE FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyBBeLXsX_lBus6lYE-dSO0zD46mSJ8PUjQ",
  authDomain: "nr-in-the-sky.firebaseapp.com",
  databaseURL: "https://nr-in-the-sky-default-rtdb.firebaseio.com",
  projectId: "nr-in-the-sky",
  storageBucket: "nr-in-the-sky-firebasestorage.app",
  messagingSenderId: "6964973342",
  appId: "1:6964973342:web:6e4e9a3178415a2330830f",
  measurementId: "G-YVY7HF69D1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d", { alpha: false, desynchronized: true });
const W=450,H=760;

const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.matchMedia("(pointer: coarse)").matches;

// --- INTRO ANIMADO ESTILO LOONEY TUNES ---
let introActive = true;
let introAnimId = null;
let introStartTime = null;

const introBills = Array.from({ length: 30 }, (_, i) => ({
 x: (i * 27 + 10) % W,
 startY: -40 - (i * 28),
 speed: 120 + (i % 6) * 32,
 swayAmp: 18 + (i % 5) * 8,
 swayFreq: 2.5 + (i % 4) * 0.8,
 rotSpeed: (i % 2 === 0 ? 1 : -1) * (2.2 + (i % 4) * 0.6),
 phase: i * 0.7
}));

const introConfetti = Array.from({ length: 22 }, (_, i) => ({
 x: (i * 15 + 5) % W,
 startY: -20 - (i * 22),
 speed: 80 + (i % 4) * 25,
 size: 4 + (i % 4) * 2,
 color: ['#ff3366', '#ffbe2e', '#35e958', '#00eaff', '#ff00ce'][i % 5],
 wobble: (i % 2 === 0 ? 1 : -1) * (1 + (i % 3) * 0.5)
}));

function finishIntro() {
 if (!introActive) return;
 unlockAudioContext();
 introActive = false;
 cancelAnimationFrame(introAnimId);
 const el = document.getElementById("looneyIntro");
 el.classList.add("fade-out");
 setTimeout(() => el.remove(), 360);
}

function drawFloatingWaveText(ictx, text, centerX, centerY, timeSec, fontSize, fillColor, shadowColor) {
 ictx.font = `bold ${fontSize}px 'Press Start 2P', monospace`;
 ictx.textAlign = "center";
 ictx.textBaseline = "middle";
 const chars = text.split("");
 const spacing = fontSize * 1.08;
 const totalWidth = (chars.length - 1) * spacing;
 const startX = centerX - totalWidth / 2;

 chars.forEach((ch, idx) => {
  if (ch === " ") return;
  const wavePhase = timeSec * 4.5 - idx * 0.55;
  const offsetY = Math.sin(wavePhase) * 10;
  const rot = Math.cos(wavePhase) * 0.14;
  const scale = 1 + Math.sin(wavePhase * 1.3) * 0.08;
  const x = startX + idx * spacing;
  const y = centerY + offsetY;

  ictx.save();
  ictx.translate(x, y);
  ictx.rotate(rot);
  ictx.scale(scale, scale);

  ictx.fillStyle = shadowColor;
  ictx.fillText(ch, 4, 5);

  ictx.lineWidth = 3;
  ictx.strokeStyle = "#080312";
  ictx.strokeText(ch, 0, 0);

  ictx.fillStyle = fillColor;
  ictx.fillText(ch, 0, 0);
  ictx.restore();
 });
}

function drawIntroDollar(ictx, x, y, angle) {
 ictx.save();
 ictx.translate(x, y);
 ictx.rotate(angle);
 ictx.fillStyle = "#48e86b";
 ictx.strokeStyle = "#0d4a1c";
 ictx.lineWidth = 1.5;
 ictx.fillRect(-13, -6.5, 26, 13);
 ictx.strokeRect(-13, -6.5, 26, 13);
 ictx.fillStyle = "#0d4a1c";
 ictx.font = "bold 9px Arial";
 ictx.textAlign = "center";
 ictx.textBaseline = "middle";
 ictx.fillText("$", 0, 0.5);
 ictx.restore();
}

function drawIntroBottle(ictx, x, y, angle, labelColor) {
 ictx.save();
 ictx.translate(x, y);
 ictx.rotate(angle);
 ictx.fillStyle = "#16291d";
 ictx.strokeStyle = "#78ff9c";
 ictx.lineWidth = 1.4;
 ictx.fillRect(-7, -8, 14, 24);
 ictx.strokeRect(-7, -8, 14, 24);
 ictx.fillRect(-3.5, -20, 7, 13);
 ictx.fillStyle = "#ffbe2e";
 ictx.fillRect(-4, -23, 8, 4);
 ictx.fillStyle = labelColor;
 ictx.fillRect(-5.5, -1, 11, 9);
 ictx.restore();
}

function drawLadyFrog(ictx, x, y, elapsed, side, bikiniColor, bodyColor, lightColor) {
 const danceBounce = Math.abs(Math.sin(elapsed * 5.2 + side)) * 12;
 const hipSway = Math.sin(elapsed * 4.2 + side) * 0.08;

 ictx.save();
 ictx.translate(x, y - danceBounce);
 ictx.rotate(hipSway);

 ictx.fillStyle = bodyColor;
 ictx.beginPath();
 ictx.ellipse(-7, 24, 4.5, 11, -0.1, 0, Math.PI * 2);
 ictx.ellipse(7, 24, 4.5, 11, 0.1, 0, Math.PI * 2);
 ictx.fill();

 ictx.fillStyle = bikiniColor;
 ictx.fillRect(-11, 32, 8, 4);
 ictx.fillRect(3, 32, 8, 4);

 ictx.fillStyle = bodyColor;
 ictx.beginPath();
 ictx.moveTo(-11, 0);
 ictx.quadraticCurveTo(-7, 8, -13, 17);
 ictx.lineTo(13, 17);
 ictx.quadraticCurveTo(7, 8, 11, 0);
 ictx.closePath();
 ictx.fill();

 ictx.fillStyle = bikiniColor;
 ictx.strokeStyle = "#ffffff";
 ictx.lineWidth = 1;
 ictx.beginPath();
 ictx.moveTo(-12, 13);
 ictx.lineTo(12, 13);
 ictx.lineTo(0, 20);
 ictx.closePath();
 ictx.fill();
 ictx.stroke();

 ictx.beginPath();
 ictx.arc(-5.5, 4, 5, 0, Math.PI * 2);
 ictx.arc(5.5, 4, 5, 0, Math.PI * 2);
 ictx.fill();
 ictx.stroke();

 ictx.fillStyle = bodyColor;
 ictx.beginPath();
 ictx.ellipse(0, -10, 17, 13, 0, 0, Math.PI * 2);
 ictx.fill();

 ictx.fillStyle = lightColor;
 ictx.beginPath();
 ictx.arc(-9, -20, 8, 0, Math.PI * 2);
 ictx.arc(9, -20, 8, 0, Math.PI * 2);
 ictx.fill();

 ictx.fillStyle = "#ffffff";
 ictx.beginPath();
 ictx.arc(-9, -21, 5, 0, Math.PI * 2);
 ictx.arc(9, -21, 5, 0, Math.PI * 2);
 ictx.fill();

 ictx.fillStyle = "#101020";
 ictx.beginPath();
 ictx.arc(-9 + side * -1.2, -21, 2.5, 0, Math.PI * 2);
 ictx.arc(9 + side * -1.2, -21, 2.5, 0, Math.PI * 2);
 ictx.fill();

 ictx.fillStyle = "#ff2a85";
 ictx.beginPath();
 ictx.ellipse(0, -6, 5, 2.5, 0, 0, Math.PI * 2);
 ictx.fill();

 const armWave = Math.sin(elapsed * 6 + side) * 0.25;
 ictx.save();
 ictx.translate(side * 11, 2);
 ictx.rotate(side * (-0.75 + armWave));
 ictx.strokeStyle = bodyColor;
 ictx.lineWidth = 4.5;
 ictx.beginPath();
 ictx.moveTo(0, 0);
 ictx.lineTo(side * 16, -12);
 ictx.stroke();
 drawIntroBottle(ictx, side * 18, -18, side * 0.35, bikiniColor);
 ictx.restore();

 ictx.save();
 ictx.translate(-side * 11, 3);
 ictx.rotate(side * (0.5 - armWave * 0.6));
 ictx.strokeStyle = bodyColor;
 ictx.lineWidth = 4.5;
 ictx.beginPath();
 ictx.moveTo(0, 0);
 ictx.lineTo(-side * 13, -8);
 ictx.stroke();
 drawIntroDollar(ictx, -side * 16, -11, -0.3);
 ictx.restore();

 ictx.restore();
}

function drawIntroPorsche(ictx, x, y) {
 ictx.save();
 ictx.translate(x, y);

 ictx.fillStyle = "rgba(0,0,0,0.55)";
 ictx.beginPath();
 ictx.ellipse(0, 26, 75, 14, 0, 0, Math.PI * 2);
 ictx.fill();

 ictx.fillStyle = "#ffd000";
 ictx.strokeStyle = "#594600";
 ictx.lineWidth = 2;
 ictx.beginPath();
 ictx.moveTo(-68, 14);
 ictx.lineTo(-58, -2);
 ictx.lineTo(-32, -22);
 ictx.lineTo(32, -22);
 ictx.lineTo(58, -2);
 ictx.lineTo(68, 14);
 ictx.closePath();
 ictx.fill();
 ictx.stroke();

 ictx.fillStyle = "#1a1a1a";
 ictx.fillRect(-8, -22, 5, 36);
 ictx.fillRect(3, -22, 5, 36);
 ictx.fillStyle = "#111";
 ictx.fillRect(-62, 12, 124, 8);

 ictx.fillStyle = "#0c1724";
 ictx.beginPath();
 ictx.moveTo(-28, -22);
 ictx.quadraticCurveTo(-18, -48, 12, -48);
 ictx.quadraticCurveTo(28, -48, 36, -22);
 ictx.closePath();
 ictx.fill();
 ictx.strokeStyle = "#65ffae";

function createNoiseBuffer(duration) {
 const bufferSize = Math.floor(audioCtx.sampleRate * duration);
 const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
 const data = buffer.getChannelData(0);
 for (let i = 0; i < bufferSize; i++) {
  data[i] = Math.random() * 2 - 1;
 }
 return buffer;
}

function getSkinColors(skin, t = 0) {
 if (skin && skin.rainbow) {
  const hue = Math.floor((t * 3) % 360);
  return {
   base: `hsl(${hue}, 92%, 55%)`,
   light: `hsl(${(hue + 25) % 360}, 100%, 74%)`,
   stroke: `hsl(${(hue + 180) % 360}, 85%, 24%)`
  };
 }
 return skin;
}

   currentSkin = skin;
   localStorage.setItem("frogMoney", playerMoney);
   let unlockedIds = skins.filter(s => s.unlocked).map(s => s.id);
   localStorage.setItem("frogUnlockedSkins", JSON.stringify(unlockedIds));

function drawProceduralFace(actx, sColors, timeVal) {
 actx.fillStyle = "white";
 actx.beginPath();
 actx.arc(-9, -8, 4.5, 0, Math.PI * 2);
 actx.arc(9, -8, 4.5, 0, Math.PI * 2);
 actx.fill();

 const blinkCycle = (timeVal * 1.8) % 3.5;
 const isBlinking = blinkCycle < 0.25;
 const gazeX = Math.sin(timeVal * 1.5) * 1.0;

 if(isBlinking) {
  actx.strokeStyle = "#101020";
  actx.lineWidth = 1.5;
  actx.beginPath();
  actx.arc(-9, -8, 2.5, 0, Math.PI);
  actx.arc(9, -8, 2.5, 0, Math.PI);
  actx.stroke();
 } else {
  actx.fillStyle = "#101020";
  actx.beginPath();
  actx.arc(-7.5 + gazeX, -8, 2.2, 0, Math.PI * 2);
  actx.arc(10.5 + gazeX, -8, 2.2, 0, Math.PI * 2);
  actx.fill();
 }

 actx.strokeStyle = sColors.stroke;
 actx.lineWidth = 1.8;
 actx.beginPath();
 actx.arc(0, 5, 6, .15, Math.PI - .15);
 actx.stroke();

 const tongueCycle = (timeVal * 1.2) % 5.0;
 if(tongueCycle < 1.2) {
  const tongueExt = Math.sin(tongueCycle * Math.PI / 1.2) * 6;
  actx.fillStyle = "#ff3385";
  actx.beginPath();
  actx.ellipse(0, 8 + tongueExt * 0.5, 2.2, 3 + tongueExt * 0.5, 0, 0, Math.PI * 2);
  actx.fill();
 }
}

function renderAvatarPreview() {
 const ac = document.getElementById("avatarCanvas");
 if(!ac || document.getElementById("shopScreen").classList.contains("hidden")) {
  avatarAnimId = null;
  return;
 }
 const actx = ac.getContext("2d");
 actx.clearRect(0, 0, ac.width, ac.height);

 const nowT = performance.now() * 0.004;
 const sColors = getSkinColors(currentSkin, nowT * 15);

 actx.save();
 actx.translate(45, 44);

 const breath = Math.sin(nowT * 1.8) * 0.04;
 actx.scale(1 + breath * 0.25, 1 + breath);

 drawCharacterBody(actx, currentChar.id, sColors, true);
 drawProceduralFace(actx, sColors, nowT);
 drawAccessory(actx, currentAcc.id, true);

 actx.restore();
 avatarAnimId = requestAnimationFrame(renderAvatarPreview);
}

function generatePlatform(y){
 stepCount++;
 const w = 110;
 // 3 carriles perfectamente simétricos: Izquierda (35), Centro (170), Derecha (305)
 const lanes = [35, (W - w) / 2, W - w - 35];
 // Patrón simétrico en zig-zag balanceado
 const pattern = [1, 0, 1, 2, 1, 0, 2, 1];
 const laneIndex = pattern[stepCount % pattern.length];
 const x = lanes[laneIndex];

 // Altura real en METROS (coincide exacto con el HUD: (720 - y) / 10)
 const altitudeMeters = Math.floor((720 - y) / 10);
 const tier = Math.floor(altitudeMeters / 1000); // 0 (<1000m), 1 (1000m+), 2 (2000m+), etc.

 // Frecuencia de plataformas móviles sube cada 1000m
 const movingInterval = Math.max(2, 5 - tier);
 const isMoving = (altitudeMeters >= 200) && (stepCount % movingInterval === 0);

 const platform={
  x,y,w,h:16,
  type:isMoving?"moving":"normal",
  dx:isMoving ? (stepCount % 2 === 0 ? 1.4 : -1.4) : 0
 };

 platforms.push(platform);

 let hx = null, hy = null;

 // --- OBSTÁCULOS (SIERRAS): CERO HASTA LOS 500 METROS REALES ---
 if (altitudeMeters >= 500) {
  // Cada 1000m aparecen con mayor frecuencia (de cada 5 escalones hasta cada 2 escalones)
  const sawInterval = Math.max(2, 5 - tier);
  if (stepCount % sawInterval === 0) {
   // Colocar la sierra simétricamente en el carril opuesto al de la plataforma
   let sawLaneIndex;
   if (laneIndex === 0) sawLaneIndex = 2;
   else if (laneIndex === 2) sawLaneIndex = 0;
   else sawLaneIndex = (stepCount % 2 === 0) ? 0 : 2;

   hx = lanes[sawLaneIndex] + w / 2;
   hy = y - 48;

   // Garantizar espacio mínimo vertical entre sierras para que nunca se forme una barrera
   const minVerticalGap = 240;
   const hasCloseHazard = hazards.some(h => Math.abs(h.y - hy) < minVerticalGap);

   if (!hasCloseHazard) {
    // Las sierras empiezan a moverse lateralmente a partir de los 1000m
    const isHazardMoving = (tier >= 1) && (stepCount % 2 === 0);
    hazards.push({
     x: hx,
     y: hy,
     r: 17,
     angle: 0,
     moving: isHazardMoving,
     dx: isHazardMoving ? (1.3 + Math.min(tier * 0.25, 1.5)) : 0,
     minX: lanes[0] + 20,
     maxX: lanes[2] + w - 20,
     speed: (0.08 + Math.min(tier * 0.015, 0.08)) * (stepCount % 2 === 0 ? 1 : -1)
    });
   } else {
    hx = null;
    hy = null;
   }
  }
 }

 // Power-ups espaciados de forma limpia
 if(stepCount % 4 === 0){
  const types=["lean","blunt","beer","wings","shield"];
  let type=types[Math.floor(Math.random()*types.length)];
  let px = x + w / 2;
  let py = y - 45;

  if(hx !== null && Math.hypot(px - hx, py - hy) < 70) {
   px = lanes[1] + w / 2;
  }

  powerups.push({
   x: px,
   y: py,
   type,
   collected:false,
   phase:stepCount,
   born:frame
  });
 }
}

const MAX_PARTICLES = 60;
function burst(x,y,color,count,power=1){
 const allowed = Math.min(count, MAX_PARTICLES - particles.length);
 for(let i=0;i<allowed;i++){
  particles.push({
   x,y,
   vx:rand(-5,5)*power,
   vy:rand(-5,4)*power,
   life:rand(16,32),
   max:32,
   size:rand(2,5),
   color,
   type:Math.random()<.3?"smoke":"spark"
  });
 }
}

function hasPower(type) {
 return player && player.activePowers.some(p => p.type === type);
}

function activatePower(type){
 shake=4;
 flash=.5;

 const durations = {
  lean: 600,
  blunt: 550,
  beer: 500,
  wings: 360,
  shield: 500
 };
 let duration = durations[type] || 500;

 let existingIndex = player.activePowers.findIndex(p => p.type === type);
 if(existingIndex !== -1) {
  player.activePowers[existingIndex].time = duration;
  player.activePowers[existingIndex].maxTime = duration;
 } else {
  if(player.activePowers.length >= 2) {
   player.activePowers.sort((a, b) => a.time - b.time);
   let removed = player.activePowers.shift();
   if(removed && removed.type === "lean") {
    timeScale = 1;
   }
  }
  player.activePowers.push({ type: type, time: duration, maxTime: duration });
 }

 if(type==="lean"){
  playLeanSound();
  timeScale = 0.5;
  burst(player.x,player.y,"#c34bff",18,1.5);
 } else if(type==="blunt"){
  playSmokeInhaleSound();
  burst(player.x,player.y,"#5bff9b",18,1.7);
 } else if(type==="beer"){
  playBurpSound();
  burst(player.x,player.y,"#ffbe2e",18,1.6);
 } else if(type==="wings"){
  playWingsSound();
  player.vy=-16;
  burst(player.x,player.y,"#a5eaff",16);
 } else if(type==="shield"){
  playShieldSound();
  burst(player.x,player.y,"#ffe45c",16);
 }
}

function triggerDeathSequence(){
 isDead = true;
 player.vx = 0;
 player.vy = -12;
 player.invuln = 999;
 shake = 15;
 flash = 0.8;
 
 bgMusic.pause();

 deadMusic.currentTime = 0;

 playerMoney += highest;

function update(stepRatio = 1){
 if(!running||paused)return;

 if(isDead){
  player.vy += 0.5 * stepRatio;
  player.y += player.vy * stepRatio;
  if(player.y > camera + H + 100){
   endGame();
  }
  return;
 }

 realFrame++;

 player.activePowers.forEach(p => p.time -= stepRatio);
 let expiredPowers = player.activePowers.filter(p => p.time <= 0);
 player.activePowers = player.activePowers.filter(p => p.time > 0);

 if(expiredPowers.some(p => p.type === "lean")) {
  timeScale = 1;
 }

 const hasLean = hasPower("lean");
 const hasBlunt = hasPower("blunt");
 const hasBeer = hasPower("beer");
 const hasWings = hasPower("wings");
 const hasShield = hasPower("shield");

 timeScale = hasLean ? 0.5 : 1;

 const dt = timeScale * stepRatio;
 frame += dt;

 // --- DIFICULTAD ESCALONADA DE 1000 EN 1000 METROS ---
 const levelTier = Math.floor(highest / 1000);
 difficulty = Math.min(1 + levelTier * 0.3, 3.4);

 if(player.invuln > 0) player.invuln -= stepRatio;

 if(particles.length < MAX_PARTICLES){
  if(hasWings && Math.random() < 0.35) {
   particles.push({
    x: player.x + rand(-30, 30),
    y: player.y + rand(-25, 25),
    vx: rand(-3, 3),
    vy: rand(-6, -2),
    life: rand(14, 24),
    max: 24,
    size: rand(4, 8),
    color: "#7deaff",
    type: "wind"
   });
  }

  if(hasBlunt){
   if(Math.random()<.2){
    particles.push({
     x:player.x+rand(-20,20),
     y:player.y+rand(-15,15),
     vx:rand(-1.5,1.5),
     vy:rand(-3,-1),
     life:rand(26,42),
     max:42,
     size:rand(7,11),
     color:"#58ff65",
     type:"leaf",
     rotation:rand(0,Math.PI*2)
    });
   }
   if(Math.random()<.3){
    particles.push({
     x:player.x + 15 + rand(-3,3),
     y:player.y + 3 + rand(-3,3),
     vx:rand(0.4, 1.8),
     vy:rand(-2.5, -1.0),
     life:rand(20,35),
     max:35,
     size:rand(4,7),
     color:"#e4fff0",
     type:"smoke"
    });
   }
  }

  if(hasBeer && Math.random()<.28){
   particles.push({
    x:player.x+rand(-18,18),
    y:player.y+rand(-10,15),
    vx:rand(-1,1),
    vy:rand(-3.5,-1.5),
    life:rand(20,36),
    max:36,
    size:rand(3,6),
    color:"#ffd447",
    type:"bubble"
   });
  }
 }

 let acceleration = 1.25 * dt;

 if(keys["arrowleft"]||keys["a"]||keys["touchleft"]) player.vx -= acceleration;
 if(keys["arrowright"]||keys["d"]||keys["touchright"]) player.vx += acceleration;

 if(hasBeer){
  player.vx += Math.sin(frame * 0.14) * 0.45 * dt;
 }

 player.vx *= Math.pow(0.84, dt);
 player.vx = clamp(player.vx, -11.5, 11.5);
 player.x += player.vx * dt;

 if(player.x<-20)player.x=W+20;
 if(player.x>W+20)player.x=-20;

 if(waitingForFirstJump) {
  player.vy = 0;
  player.y = 720 - player.height / 2;
 } else {
  if(hasWings){
   player.vy=Math.min(player.vy+.18*dt,-2.5);
  }else if(hasBeer && player.vy > 0){
   player.vy+=.24*dt;
  }else{
   player.vy+=.42*dt;
  }

  let oldY=player.y;
  player.y+=player.vy*dt;

  if(player.vy>0){
   for(let p of platforms){
    if(
     player.x+player.width/2>p.x&&
     player.x-player.width/2<p.x+p.w&&
     oldY+player.height/2<=p.y&&
     player.y+player.height/2>=p.y
    ){
     player.y=p.y-player.height/2;
     if(hasBlunt){
      player.vy = -17.7;
      burst(player.x,player.y+18,"#5bff9b",8,1.3);
     } else {
      player.vy = -12.5;
      burst(player.x,player.y+18,"#75ff9b",5);
     }
    }
   }
  }
 }

 for(let p of platforms){
  if(p.type==="moving"){
   p.x+=p.dx*difficulty*.6*dt;
   if(p.x<20||p.x+p.w>W-20)p.dx*=-1;
  }
 }

 for(let h of hazards){
  h.angle+=h.speed*difficulty*dt;
  if(h.moving){
   h.x += h.dx * difficulty * 0.75 * dt;
   if(h.x < h.minX || h.x > h.maxX) h.dx *= -1;
  }

  let d=Math.hypot(player.x-h.x,player.y-h.y);

  if(d<h.r+17){
   if(hasShield){
    playHitSound();
    burst(h.x,h.y,"#ffe45c",14);
    h.y = camera + H + 500;
    player.activePowers = player.activePowers.filter(p => p.type !== "shield");
    shake=12;
   }else if(player.invuln<=0){
    playHitSound();
    player.lives--;
    updateLivesHUD();
    burst(player.x,player.y,"#ff3b5c",18);
    h.y = camera + H + 500;

    if(player.lives<=0){
     triggerDeathSequence();
     return;
    }else{
     player.invuln=120;
     player.vy=-14;
     shake=15;
     flash=0.8;
    }
   }
  }
 }

 for(let p of powerups){
  if(p.collected)continue;
  let d=Math.hypot(player.x-p.x,player.y-p.y);
  if(d<37){
   p.collected=true;
   activatePower(p.type);
  }
 }

 let targetCamera = waitingForFirstJump ? 0 : player.y - H * .45;

 if(!waitingForFirstJump) {
  if(player.vy<0)targetCamera+=player.vy*2.8;
  if(player.vy>5)targetCamera+=player.vy*.8;
 }

 let cameraDifference=targetCamera-camera;
 cameraVelocity+=(cameraDifference*.035-cameraVelocity*.65)*dt;
 camera+=cameraVelocity*dt;

 let baseGain = Math.max(0,(720-player.y)/10);
 const newHighest = Math.max(highest, Math.floor(baseGain));
 if (newHighest !== highest) {
  highest = newHighest;
  document.getElementById("score").textContent = highest;
 }

 if(player.y>camera+H+100 && !isDead && !waitingForFirstJump){
  player.lives=0;
  updateLivesHUD();
  triggerDeathSequence();
  return;
 }

 // Generación continua conforme sube la cámara
 const topBoundary = Math.min(camera, player.y) - 1100;
 while(lastGenerationY > topBoundary){
  lastGenerationY -= 110;
  generatePlatform(lastGenerationY);
 }

 // Limpieza limpia de entidades que ya quedaron abajo de la pantalla
 const bottomCleanup = camera + H + 150;
 platforms = platforms.filter(p => p.y < bottomCleanup);
 hazards = hazards.filter(h => h.y < bottomCleanup);
 powerups = powerups.filter(p => !p.collected && p.y < bottomCleanup);

 for (let i = particles.length - 1; i >= 0; i--) {
  const p = particles[i];
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (p.type !== "bubble" && p.type !== "wind" && p.type !== "smoke") p.vy += 0.08 * dt;
  p.life -= dt;
  if (p.life <= 0) particles.splice(i, 1);
 }

 shake *= Math.pow(0.88, stepRatio);
 flash *= Math.pow(0.9, stepRatio);

 const powerContainer = document.getElementById("powerContainer");
 const currentTypesHash = player.activePowers.map(p => p.type).join(",");

 if (currentTypesHash !== lastPowerHUDHash) {
  lastPowerHUDHash = currentTypesHash;
  if (player.activePowers.length > 0) {
   const powerMeta = {
    lean: { label: "🥤 LEAN", color: "#c34bff" },
    blunt: { label: "🚬 WEED", color: "#5bff9b" },
    beer: { label: "🍺 DRUNK", color: "#ffbe2e" },
    shield: { label: "🛡️ SHIELD", color: "#ffe45c" },
    wings: { label: "🪽 WINGS", color: "#7deaff" }
   };
   powerContainer.innerHTML = player.activePowers.map((ap, idx) => {
    const meta = powerMeta[ap.type] || { label: ap.type.toUpperCase(), color: "#ffffff" };
    return `
     <div class="power-slot">
      <div id="pwrLbl_${idx}" class="power-label" style="color:${meta.color}">${meta.label}</div>
      <div class="timer-bar-bg">
       <div id="pwrBar_${idx}" class="timer-bar-fill" style="width:100%;background:${meta.color};"></div>
      </div>
     </div>
    `;
   }).join("");
  } else {
   powerContainer.innerHTML = "";
  }
 }

 if (player.activePowers.length > 0 && realFrame % 2 === 0) {
  const powerNames = {
   lean: "🥤 LEAN",
   blunt: "🚬 WEED",
   beer: "🍺 DRUNK",
   shield: "🛡️ SHIELD",
   wings: "🪽 WINGS"
  };
  player.activePowers.forEach((ap, idx) => {
   const lblEl = document.getElementById(`pwrLbl_${idx}`);
   const barEl = document.getElementById(`pwrBar_${idx}`);
   if (lblEl && barEl) {
    const pct = Math.max(0, Math.min(100, (ap.time / ap.maxTime) * 100));
    const secs = (ap.time / 60).toFixed(1);
    lblEl.textContent = `${powerNames[ap.type] || ap.type} (${secs}s)`;
    barEl.style.width = pct + "%";
   }
  });
 }
}

 if(!sc || document.getElementById("gameOverOverlay").classList.contains("hidden")) return;
 const sctx = sc.getContext("2d");

 sctx.save();
 const bob = Math.sin(t * 2.2) * 2.5;
 sctx.translate(50, 68 + bob);

 const charId = currentChar.id;

 if (charId === 'frog') {
  sctx.fillStyle = sColors.light;
  sctx.strokeStyle = sColors.stroke;
  sctx.lineWidth = 2;
  sctx.beginPath();
  sctx.ellipse(0, 6, 24, 15, 0, 0, Math.PI * 2);

  sctx.beginPath();
  sctx.arc(-12, -9, 11, 0, Math.PI * 2);
  sctx.arc(12, -9, 11, 0, Math.PI * 2);
  sctx.fill();
  sctx.stroke();
  sctx.fillRect(-13, -12, 26, 14);

  sctx.fillStyle = "#0b0514";
  sctx.beginPath();
  sctx.arc(-12, -9, 7, 0, Math.PI * 2);
  sctx.arc(12, -9, 7, 0, Math.PI * 2);
  sctx.fill();

  sctx.strokeStyle = "#0b0514";
  sctx.lineWidth = 1.8;
  sctx.beginPath();
  sctx.moveTo(-12, 11); sctx.quadraticCurveTo(0, 7, 12, 11);
  sctx.stroke();
  for(let dx = -8; dx <= 8; dx += 4){
   sctx.beginPath(); sctx.moveTo(dx, 8); sctx.lineTo(dx, 13); sctx.stroke();
  }

 } else if (charId === 'capybara') {
  sctx.fillStyle = sColors.stroke;
  sctx.beginPath();
  sctx.arc(-16, -15, 5.5, 0, Math.PI * 2);
  sctx.arc(16, -15, 5.5, 0, Math.PI * 2);

  sctx.fillStyle = sColors.base;
  sctx.beginPath();
  sctx.roundRect(-22, -10, 44, 30, 12);
  sctx.fill();

  sctx.strokeStyle = "#0b0514";
  sctx.lineWidth = 2.5;
  [-10, 10].forEach(ox => {
   sctx.beginPath();
   sctx.moveTo(ox - 4, -3); sctx.lineTo(ox + 4, 5);
   sctx.moveTo(ox - 4, 5); sctx.lineTo(ox + 4, -3);
   sctx.stroke();
  });

  sctx.fillStyle = sColors.light;
  sctx.beginPath();
  sctx.roundRect(-10, 4, 20, 12, 6);

 } else if (charId === 'dog') {
  sctx.fillStyle = sColors.stroke;
  sctx.beginPath();

  sctx.ellipse(20, 0, 5, 12, -0.25, 0, Math.PI * 2);

  sctx.fillStyle = sColors.base;
  sctx.beginPath();
  sctx.ellipse(0, 4, 20, 18, 0, 0, Math.PI * 2);
  sctx.fill();

  sctx.strokeStyle = "#0b0514";
  sctx.lineWidth = 2.5;
  [-9, 9].forEach(ox => {
   sctx.beginPath();
   sctx.moveTo(ox - 4, -2); sctx.lineTo(ox + 4, 6);
   sctx.moveTo(ox - 4, 6); sctx.lineTo(ox + 4, -2);
   sctx.stroke();
  });

  sctx.fillStyle = sColors.light;
  sctx.beginPath();
  sctx.ellipse(0, 8, 10, 7, 0, 0, Math.PI * 2);
  sctx.fill();

 } else if (charId === 'cat') {
  sctx.fillStyle = sColors.base;
  sctx.beginPath();
  sctx.moveTo(-19, -4); sctx.lineTo(-15, -22); sctx.lineTo(-4, -12); sctx.closePath(); sctx.fill();
  sctx.beginPath();
  sctx.moveTo(19, -4); sctx.lineTo(15, -22); sctx.lineTo(4, -12); sctx.closePath(); sctx.fill();

  sctx.beginPath();
  sctx.ellipse(0, 4, 20, 17, 0, 0, Math.PI * 2);
  sctx.fill();

  sctx.strokeStyle = "#0b0514";
  sctx.lineWidth = 2.5;
  [-9, 9].forEach(ox => {
   sctx.beginPath();
   sctx.moveTo(ox - 4, -2); sctx.lineTo(ox + 4, 6);
   sctx.moveTo(ox - 4, 6); sctx.lineTo(ox + 4, -2);
   sctx.stroke();
  });

  sctx.strokeStyle = sColors.light;
  sctx.lineWidth = 1;
  sctx.beginPath();
  sctx.moveTo(-12, 8); sctx.lineTo(-24, 12);
  sctx.moveTo(12, 8); sctx.lineTo(24, 12);
  sctx.stroke();

 } else if (charId === 'bat') {
  sctx.fillStyle = sColors.stroke;
  sctx.beginPath();
  sctx.moveTo(-16, 2); sctx.quadraticCurveTo(-30, -10, -32, 6); sctx.lineTo(-16, 12); sctx.closePath(); sctx.fill();
  sctx.beginPath();
  sctx.moveTo(16, 2); sctx.quadraticCurveTo(30, -10, 32, 6); sctx.lineTo(16, 12); sctx.closePath(); sctx.fill();

  sctx.fillStyle = sColors.base;
  sctx.beginPath();
  sctx.moveTo(-17, -6); sctx.lineTo(-14, -24); sctx.lineTo(-3, -12);
  sctx.lineTo(3, -12); sctx.lineTo(14, -24); sctx.lineTo(17, -6);
  sctx.closePath();
  sctx.fill();

  sctx.beginPath();
  sctx.ellipse(0, 6, 18, 16, 0, 0, Math.PI * 2);
  sctx.fill();

  sctx.strokeStyle = "#0b0514";
  sctx.lineWidth = 2.5;
  [-8, 8].forEach(ox => {
   sctx.beginPath();
   sctx.moveTo(ox - 3, 1); sctx.lineTo(ox + 3, 7);
   sctx.moveTo(ox - 3, 7); sctx.lineTo(ox + 3, 1);
   sctx.stroke();
  });

 } else if (charId === 'crocodile') {
  sctx.fillStyle = sColors.stroke;
  for (let cx = -10; cx <= 10; cx += 7) {
   sctx.beginPath(); sctx.moveTo(cx - 2, -10); sctx.lineTo(cx, -17); sctx.lineTo(cx + 2, -10); sctx.closePath(); sctx.fill();
  }
  sctx.fillStyle = sColors.base;
  sctx.beginPath();
  sctx.roundRect(-22, -10, 44, 32, 12);
  sctx.fill();

  sctx.strokeStyle = "#0b0514";
  sctx.lineWidth = 2.5;
  [-10, 10].forEach(ox => {
   sctx.beginPath();
   sctx.moveTo(ox - 4, -2); sctx.lineTo(ox + 4, 6);
   sctx.moveTo(ox - 4, 6); sctx.lineTo(ox + 4, -2);
   sctx.stroke();
  });

 } else if (charId === 'bear') {
  sctx.fillStyle = sColors.base;
  sctx.beginPath();
  sctx.arc(-15, -12, 7, 0, Math.PI * 2);
  sctx.arc(15, -12, 7, 0, Math.PI * 2);
  sctx.fill();

  sctx.beginPath();
  sctx.ellipse(0, 4, 21, 19, 0, 0, Math.PI * 2);
  sctx.fill();

  sctx.strokeStyle = "#0b0514";
  sctx.lineWidth = 2.5;
  [-9, 9].forEach(ox => {
   sctx.beginPath();
   sctx.moveTo(ox - 4, -2); sctx.lineTo(ox + 4, 6);
   sctx.moveTo(ox - 4, 6); sctx.lineTo(ox + 4, -2);
   sctx.stroke();
  });

  sctx.fillStyle = sColors.light;
  sctx.beginPath();
  sctx.ellipse(0, 8, 11, 8, 0, 0, Math.PI * 2);
  sctx.fill();
 }

 sctx.save();
 sctx.translate(0, -4);
 drawAccessory(sctx, currentAcc.id, true);
 sctx.restore();

 sctx.fillStyle = "#38f2ff";
 for(let i = 0; i < 3; i++){
  const dropProgress = (t * 1.4 + i * 0.33) % 1;
  const tearY = 2 + dropProgress * 26;
  const r = 2.5 * (1 - dropProgress * 0.4);

  sctx.beginPath();
  sctx.arc(-10, tearY, r, 0, Math.PI * 2);
  sctx.arc(10, tearY, r, 0, Math.PI * 2);
  sctx.fill();
 }
 sctx.restore();

 skullAnimId = requestAnimationFrame(animateCustomSkull);
}

function endGame(){
 running=false;
 if(highest>best){
  best=highest;
  localStorage.setItem("frogBest",best);
 }

 if (highest > 0 && playerName) {
  db.collection("leaderboard").add({
   name: playerName,
   score: highest,
   timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch((err) => console.error("Error guardando récord:", err));
 }

 document.getElementById("best").textContent=best;
 document.getElementById("deadPlayerName").textContent=playerName;
 document.getElementById("finalScore").textContent=highest;
 document.getElementById("earnedMoney").textContent=`+$${highest}`;
 document.getElementById("deathFlavorText").textContent = currentChar.deathText;

 document.getElementById("gameOverOverlay").classList.remove("hidden");
 document.getElementById("powerContainer").innerHTML = "";
 animateCustomSkull();
}

function togglePause(){
 if(!running&&!paused)return;
 paused=!paused;
 document.getElementById("pauseScreen").classList.toggle("hidden",!paused);
 if(!paused&&running){
  lastTime=0;
  animationId = requestAnimationFrame(loop);
 }
}

const bgGradients = {
 normal: (() => {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0f6dd9");
  g.addColorStop(0.5,"#3898ff");
  g.addColorStop(1,"#73c2ff");
  return g;
 })(),
 lean: (() => {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#18053a");
  g.addColorStop(.35,"#42117d");
  g.addColorStop(.7,"#9c38d4");
  g.addColorStop(1,"#ff53df");
  return g;
 })(),
 blunt: (() => {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#004a20");
  g.addColorStop(0.5,"#a38c00");
  g.addColorStop(1,"#850015");
  return g;
 })()
};

function drawBackground(){
 let isBlunt = hasPower("blunt");
 let isLean = hasPower("lean");

 if(isLean){
  ctx.fillStyle = bgGradients.lean;
  ctx.fillRect(0,0,W,H);
 } else if(isBlunt){
  ctx.fillStyle = bgGradients.blunt;
  ctx.fillRect(0,0,W,H);
 } else {
  ctx.fillStyle = bgGradients.normal;
  ctx.fillRect(0,0,W,H);

  let sunX = W - 90;
  let sunY = 90 - camera * 0.15;
  if(sunY > -60) {
   ctx.fillStyle = "rgba(255, 234, 85, 0.22)";
   ctx.beginPath();
   ctx.arc(sunX, sunY, 64, 0, Math.PI*2);
   ctx.fill();

   ctx.fillStyle = "#fff580";
   ctx.beginPath();
   ctx.arc(sunX, sunY, 48, 0, Math.PI*2);
   ctx.fill();
  }
 }

 const groundWorldY = 720;
 const canvasGroundY = groundWorldY - camera;

 if(canvasGroundY > -450) {
  ctx.save();

  ctx.fillStyle = "#1b2845";
  const buildings = [
   {x: -15, w: 85, h: 320},
   {x: 75, w: 90, h: 410},
   {x: 170, w: 105, h: 350},
   {x: 280, w: 95, h: 440},
   {x: 380, w: 85, h: 310}
  ];
  buildings.forEach(b => {
   ctx.fillRect(b.x, canvasGroundY - b.h, b.w, b.h);
   ctx.fillStyle = "#fffaad";
   for(let wx = b.x + 12; wx < b.x + b.w - 12; wx += 18) {
    for(let wy = canvasGroundY - b.h + 20; wy < canvasGroundY - 20; wy += 26) {
     if((wx + wy) % 5 !== 0) ctx.fillRect(wx, wy, 8, 14);
    }
   }
   ctx.fillStyle = "#1b2845";
  });

  ctx.fillStyle = "#111827";
  ctx.fillRect(0, canvasGroundY - 45, W, 45);
  ctx.strokeStyle = "#374151";
  ctx.lineWidth = 1.5;
  for(let rx = 0; rx < W; rx += 14) {
   ctx.beginPath();
   ctx.moveTo(rx, canvasGroundY - 45);
   ctx.lineTo(rx + 7, canvasGroundY);
   ctx.moveTo(rx + 14, canvasGroundY - 45);
   ctx.lineTo(rx + 7, canvasGroundY);
   ctx.stroke();
  }

  ctx.restore();
 }

 ctx.fillStyle = isLean ? "#e0bfff" : "rgba(255,255,255,0.92)";
 for(let i=0;i<5;i++){
  let x=(i*115+Math.sin(frame*.012+i)*25)%W;
  let y=((i*145+camera*.2)%H+H)%H;
  drawCloud(x,y,35);
 }

 if(isBlunt){
  ctx.save();
  ctx.strokeStyle = "rgba(100, 255, 120, 0.35)";
  ctx.lineWidth = 3;
  for(let wLine = 0; wLine < 3; wLine++){
   ctx.beginPath();
   for(let xCoord = 0; xCoord < W; xCoord += 45){
    let wy = (wLine * 220 + Math.sin(xCoord * 0.02 + frame * 0.08 + wLine) * 45 + camera * 0.5) % H;
    if(xCoord === 0) ctx.moveTo(xCoord, wy);
    else ctx.lineTo(xCoord, wy);
   }
   ctx.stroke();
  }
  ctx.restore();
 }
}

function drawCloud(x,y,r){
 ctx.beginPath();
 ctx.arc(x,y,r*.65,0,Math.PI*2);
 ctx.arc(x+r*.65,y-r*.25,r*.65,0,Math.PI*2);
 ctx.arc(x+r*1.2,y,r*.7,0,Math.PI*2);
 ctx.fill();
}

function drawPlatform(p){
 let y=p.y-camera;
 if (y < -40 || y > H + 40) return;

 if(p.type==="ground"){
  ctx.fillStyle = "#0f2018";
  ctx.fillRect(p.x, y + 26, p.w, H * 2);

  ctx.fillStyle = "#1e3d2f";
  ctx.fillRect(p.x, y - 10, p.w, p.h + 36);

  ctx.fillStyle = "#2ecc71";
  ctx.fillRect(p.x, y, p.w, 14);

  ctx.fillStyle = "#34495e";
  ctx.fillRect(p.x, y + 14, p.w, p.h);

  ctx.fillStyle = "#7f8c8d";
  ctx.fillRect(p.x, y + p.h, p.w, 12);
  return;
 }

 ctx.fillStyle = p.type==="moving" ? "#d02dff" : "#48ff9b";
 ctx.fillRect(p.x, y, p.w, p.h);

 ctx.fillStyle = p.type==="moving" ? "#ff9bfa" : "#d0ff9c";
 ctx.fillRect(p.x, y, p.w, 6);

 ctx.fillStyle = "#116b76";
 ctx.fillRect(p.x, y + p.h - 4, p.w, 4);

 ctx.strokeStyle="#caffff";
 ctx.lineWidth=1;
 ctx.strokeRect(p.x,y,p.w,p.h);
}

function drawSaw(h){
 let y=h.y-camera;
 if (y < -45 || y > H + 45) return;

 ctx.save();
 ctx.translate(h.x,y);
 ctx.rotate(h.angle);

 for(let i=0;i<8;i++){
  ctx.rotate(Math.PI/4);
  ctx.fillStyle=i%2?(h.moving?"#ffb9c4":"#ffe0b2"):"#e5faff";
  ctx.strokeStyle=h.moving?"#ff334d":"#ff5500";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(-7,-h.r+5);
  ctx.lineTo(0,-h.r-13);
  ctx.lineTo(7,-h.r+5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
 }

 ctx.beginPath();
 ctx.arc(0,0,h.r-5,0,Math.PI*2);
 ctx.fillStyle=h.moving?"#778ba8":"#554433";
 ctx.fill();
 ctx.strokeStyle="white";
 ctx.lineWidth=2.5;
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(0,0,6,0,Math.PI*2);
 ctx.fillStyle="#171126";
 ctx.fill();
 ctx.restore();
}

function drawLean(x,y){
 ctx.save();

 ctx.rotate(-.09+Math.sin(frame*.06)*.035);

 ctx.fillStyle="#a83cff33";
 ctx.beginPath();
 ctx.arc(0,0,30,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="rgba(215, 140, 255, 0.35)";
 ctx.strokeStyle="#f3ccff";
 ctx.lineWidth=1.5;
 ctx.beginPath();
 ctx.moveTo(-16,-18);
 ctx.lineTo(16,-18);
 ctx.lineTo(12,22);
 ctx.lineTo(-12,22);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 ctx.fillStyle="#5e00a3";
 ctx.beginPath();
 ctx.moveTo(-13,-2);
 ctx.lineTo(13,-2);
 ctx.lineTo(11.5,21);
 ctx.lineTo(-11.5,21);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#ffffff";
 ctx.fillRect(-18,-21,36,5);

 ctx.strokeStyle="#ff55e3";
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.moveTo(4,-19);

function drawBeer(x,y){

 ctx.fillStyle="#ffae0033";
 ctx.beginPath();
 ctx.arc(0,0,30,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#e6f7ff";
 ctx.lineWidth=4;
 ctx.beginPath();
 ctx.arc(13, 2, 8, -Math.PI/2, Math.PI/2);
 ctx.stroke();

 ctx.fillStyle = "#f59b00";
 ctx.strokeStyle = "#ffffff";
 ctx.lineWidth = 2;
 ctx.beginPath();
 ctx.roundRect(-13, -12, 26, 30, 4);
 ctx.fill();

 ctx.fillStyle = "#ffffff";
 ctx.beginPath();
 ctx.arc(-9, -13, 6, 0, Math.PI*2);

}

function drawBlunt(x,y){

 ctx.translate(x,y);
 ctx.rotate(-.45+Math.sin(frame*.06)*.04);

 ctx.fillStyle="#45ff9b33";
 ctx.beginPath();
 ctx.arc(0,0,30,0,Math.PI*2);

 ctx.fillStyle="#e8d0a3";
 ctx.strokeStyle="#9a8059";
 ctx.lineWidth=1.5;
 ctx.beginPath();

}

function drawWeedLeaf(x,y,size,rotation){

 ctx.rotate(rotation);

 ctx.moveTo(0,size);

 targetCtx.strokeStyle="#54ff9b";

function drawSymmetricWings(sideMultiplier){
 ctx.save();
 ctx.strokeStyle = "#a5eaff";
 ctx.fillStyle = "rgba(125, 234, 255, 0.35)";
 ctx.lineWidth = 2;

 let flapAngle = Math.sin(frame * 0.22) * 0.45 * sideMultiplier;

 ctx.translate(sideMultiplier * 20, -2);
 ctx.rotate(flapAngle + (sideMultiplier > 0 ? 0.3 : -0.3));

 ctx.beginPath();
 ctx.moveTo(0, 0);
 ctx.quadraticCurveTo(sideMultiplier * 28, -18, sideMultiplier * 36, -8);
 ctx.quadraticCurveTo(sideMultiplier * 22, 12, 0, 8);
 ctx.closePath();
 ctx.fill();
 ctx.stroke();

 ctx.restore();
}

function drawOtherPower(x,y,type){
 ctx.save();
 ctx.translate(x,y);

 ctx.fillStyle=type==="wings"?"#a5eaff":"#ffe45c";
 ctx.beginPath();
 ctx.arc(0,0,19,0,Math.PI*2);
 ctx.fill();

 ctx.font="24px Arial";
 ctx.textAlign="center";
 ctx.fillText(type==="wings"?"🪽":"🛡️",0,8);
 ctx.restore();
}

function drawPower(p){
 let y=p.y-camera+Math.sin(frame*.08+p.phase)*5;
 if (y < -50 || y > H + 50) return;

 if(p.type==="lean")drawLean(p.x,y);
 else if(p.type==="blunt")drawBlunt(p.x,y);
 else if(p.type==="beer")drawBeer(p.x,y);
 else drawOtherPower(p.x,y,p.type);
}

function drawSpiralEye(cx, cy){
 ctx.save();
 ctx.translate(cx, cy);
 ctx.rotate(frame * 0.25);
 ctx.strokeStyle = "#8c00ff";
 ctx.lineWidth = 1.6;
 ctx.beginPath();
 for(let a = 0; a < Math.PI * 3.5; a += 0.55){
  let r = a * 0.55;
  let px = Math.cos(a) * r;
  let py = Math.sin(a) * r;
  if(a === 0) ctx.moveTo(px, py);
  else ctx.lineTo(px, py);
 }
 ctx.stroke();
 ctx.restore();
}

function drawGameFrogFace(sColors){
 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(-13,-11,7,0,Math.PI*2);
 ctx.arc(13,-11,7,0,Math.PI*2);
 ctx.fill();

 let isBlunt = hasPower("blunt");
 let isLean = hasPower("lean");

 if(isLean){
  drawSpiralEye(-13, -11);
  drawSpiralEye(13, -11);
 } else if(isBlunt){
  ctx.fillStyle="#ff3131";
  ctx.beginPath();
  ctx.arc(-13,-11,5,0,Math.PI*2);
  ctx.arc(13,-11,5,0,Math.PI*2);
  ctx.fill();
 } else {
  const blinkCycle = (frame * 0.035) % 3.5;
  const isBlinking = blinkCycle < 0.25;
  const gazeX = Math.sin(frame * 0.05) * 1.0;

  if(isBlinking) {
   ctx.strokeStyle = "#101020";
   ctx.lineWidth = 1.8;
   ctx.beginPath();
   ctx.arc(-13, -11, 3.5, 0, Math.PI);
   ctx.arc(13, -11, 3.5, 0, Math.PI);
   ctx.stroke();
  } else {
   ctx.fillStyle="#101020";
   ctx.beginPath();
   ctx.arc(-11 + gazeX,-10,3.2,0,Math.PI*2);
   ctx.arc(15 + gazeX,-10,3.2,0,Math.PI*2);
   ctx.fill();
  }
 }

 ctx.strokeStyle = sColors.stroke;
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,7,9,.15,Math.PI-.15);
 ctx.stroke();
}

function drawFrog(offsetX = 0, offsetY = 0, ghostAlpha = 1){
 let x=player.x + offsetX, y=player.y - camera + offsetY;
 const sColors = getSkinColors(currentSkin, frame);
 ctx.save();
 ctx.translate(x,y);

 if(ghostAlpha < 1){
  ctx.globalAlpha = ghostAlpha;
 }

 if(isDead){
  ctx.rotate(Math.PI);
 }

 if(player.invuln > 0 && Math.floor(frame * 0.5) % 2 === 0 && !isDead){
  ctx.globalAlpha *= 0.4;
 }

 if(hasPower("wings") && !isDead){
  drawSymmetricWings(-1);
  drawSymmetricWings(1);
 }

 if(hasPower("shield") && !isDead){
  ctx.strokeStyle="#9ffaff";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(0,0,32,0,Math.PI*2);
  ctx.stroke();
 }

 let isBlunt = hasPower("blunt");
 let isLean = hasPower("lean");

 drawCharacterBody(ctx, currentChar.id, sColors, false);
 drawGameFrogFace(sColors);

 if(isLean && !isDead){
  ctx.fillStyle = "#a81aff";
  let droolLength = 6 + Math.sin(frame * 0.12) * 4;
  ctx.fillRect(2, 11, 3, droolLength);
 }

 if(isBlunt && !isDead){
  ctx.save();
  ctx.translate(2, 8);
  ctx.rotate(-0.22);
  ctx.fillStyle="#fff1d1";
  ctx.fillRect(0, -2.5, 17, 5);
  ctx.fillStyle="#d58d54";
  ctx.fillRect(0, -2.5, 4.5, 5);
  ctx.fillStyle="#ff3131";
  ctx.beginPath();
  ctx.arc(17, 0, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
 }

 drawAccessory(ctx, currentAcc.id, false);
 ctx.restore();
}

function drawParticles(){
 for (let i = 0; i < particles.length; i++) {
  const p = particles[i];
  const py = p.y - camera;
  if (py < -30 || py > H + 30) continue;

  ctx.globalAlpha = Math.max(0, p.life / p.max);

  if(p.type==="leaf"){
   drawWeedLeaf(p.x, py, p.size, frame*.08+(p.rotation||0));
   continue;
  }

  if(p.type==="wind"){
   ctx.strokeStyle = "#a5eaff";
   ctx.lineWidth = 2.5;
   ctx.beginPath();
   ctx.moveTo(p.x - p.size, py - p.size);
   ctx.lineTo(p.x + p.size, py + p.size);
   ctx.stroke();
   continue;
  }

  ctx.fillStyle=p.color;

  if(p.type==="smoke" || p.type==="bubble"){
   ctx.beginPath();
   ctx.arc(p.x, py, p.size*(p.type==="bubble"?0.8:1.5), 0, Math.PI*2);
   ctx.fill();
  }else{
   ctx.fillRect(p.x, py, p.size, p.size);
  }
 }
 ctx.globalAlpha = 1;
}

function draw(){
 ctx.save();
 if(shake>0.5){
  ctx.translate(rand(-shake,shake),rand(-shake,shake));
 }
 let isBeer = hasPower("beer");
 if(isBeer && !isDead){
  const swayX = Math.sin(frame * 0.09) * 5;
  ctx.translate(swayX, 0);
 }

 drawBackground();
 for (let i = 0; i < platforms.length; i++) drawPlatform(platforms[i]);
 for (let i = 0; i < hazards.length; i++) drawSaw(hazards[i]);
 for (let i = 0; i < powerups.length; i++) drawPower(powerups[i]);
 drawParticles();

 if(waitingForFirstJump) {
  ctx.fillStyle = "rgba(8, 4, 20, 0.85)";
  ctx.fillRect(15, H / 2 - 42, W - 30, 84);
  
  ctx.strokeStyle = "#65ffae";
  ctx.lineWidth = 2.5;
  ctx.strokeRect(15, H / 2 - 42, W - 30, 84);

  ctx.font = "bold 11px 'Press Start 2P', monospace";
  ctx.fillStyle = "#65ffae";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(isMobileDevice ? "¡TOCA LA PANTALLA O" : "¡USA LAS FLECHAS O A/D", W/2, H / 2 - 14);
  ctx.fillStyle = "#ff5de5";
  ctx.fillText(isMobileDevice ? "ESPACIO PARA BRINCAR!" : "Y ESPACIO PARA BRINCAR!", W/2, H / 2 + 14);
  ctx.textBaseline = "alphabetic";
 }

 if(player){
  if(isBeer && !isDead){
   const ghostShift = Math.sin(frame * 0.14) * 14;
   drawFrog(ghostShift, -4, 0.35);
   drawFrog(-ghostShift, 4, 0.35);
  }
  drawFrog();
 }
 ctx.restore();

 if(hasPower("blunt") && !isDead){
  const hue = (frame * 4) % 360;
  ctx.fillStyle = `hsla(${hue}, 90%, 50%, 0.12)`;
  ctx.fillRect(0, 0, W, H);
 } else if(isBeer && !isDead){
  ctx.fillStyle = "rgba(255, 190, 46, 0.14)";
  ctx.fillRect(0, 0, W, H);
 }

 if(flash>.01){
  ctx.globalAlpha=flash*.25;
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;
 }
}

function loop(timestamp){
 if(!running||paused)return;
 if(!lastTime)lastTime=timestamp;
 const elapsedMs = timestamp - lastTime;
 lastTime = timestamp;

 const stepRatio = Math.min(elapsedMs / 16.667, 2.5) || 1;

 update(stepRatio);
 draw();

 if(running&&!paused){
  animationId=requestAnimationFrame(loop);
 }
}
</script>
